x-zenith:
  catalog:
    name: 3DTool — Shape Studio
    description: Describe furniture and simple shapes in plain English; a Hugging Face model (via Inference Providers, using your own token) plans the edits and native Three.js builders create editable 3D geometry. Export to GLB.
    authors: [arashlove]
    source: https://github.com/arashlove/3dtool
    license: MIT
    tags: [nextjs, threejs, 3d, ai, huggingface]
  expose:
    - { service: web, port: 3000, web: true }
  env:
    HF_TOKEN:
      services: [web]
      input:
        label: Hugging Face token (Future Lab)
        description: Optional. Read token with "Make calls to Inference Providers" permission, used server-side by the Future Lab AI features. Shape Studio uses each visitor's own token instead.
        required: false
        secret: true

services:
  web:
    build: .
    environment:
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    ports:
      - "3000:3000"
